name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - name: Push schema to CI Postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test
        run: bun run db:push
      - name: Run DB integration tests
        env:
          CUSTOMERS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test
        run: bun run test:integration
