name: factory-pr-revise
description: |
  Addresses human maintainer review feedback (`CHANGES_REQUESTED`, inline review threads,
  or `/fix` / `/revise` PR comments) on an existing Factory pull request. Verifies the
  reviewer against `.archon/sdlc/policy/maintainers.json`, checks out the PR head branch,
  applies fixes within the reserved folders and protected-path policy, re-runs the
  Mechanical Gate + optional UX verification + independent QA review, pushes updates to
  the same PR, and routes through the configured merge policy.

inputs:
  pr:
    default: ""
    description: Pull request number to revise (e.g. "12"). Can also be passed in the task message as `#12`.
  issue:
    default: ""
    description: Optional linked GitHub issue number containing the slice contract (auto-detected from PR body if empty).
  spec_file:
    default: ""
    description: Optional local slice contract path when the PR has no linked GitHub issue.
  repo:
    default: ""
    description: Optional GitHub owner/repo (auto-detected from git remote origin when empty).
  preview_cmd:
    default: ""
    description: Optional preview server command (defaults to .archon/ui-preview.sh when present and executable).
  merge_mode:
    default: "ask"
    description: >-
      Merge policy: ask (default), checkpoint, auto, ui-ask, or pr-only.
  ci_wait_seconds:
    default: "600"
    description: Max seconds to poll GitHub Actions checks before timing out ("0" skips waiting).
  allowed_folders:
    default: "[]"
    description: JSON array of literal repository-relative directories ending in /. Empty means exclusive delivery.

worktree:
  enabled: true

returns:
  node: summary
  outcome: delivered

nodes:
  - id: fetch-pr-feedback
    script: fetch-pr-feedback
    runtime: bun
    with:
      pr: "$INPUTS.pr"
      issue: "$INPUTS.issue"
      spec_file: "$INPUTS.spec_file"
      repo: "$INPUTS.repo"
      preview_cmd: "$INPUTS.preview_cmd"
      allowed_folders: "$INPUTS.allowed_folders"
      run_id: "$WORKFLOW_ID"
    output_format:
      type: object
      properties:
        ready: { type: boolean }
        cancel_reason: { type: string }
        repo: { type: string }
        pr_number: { type: integer }
        pr_url: { type: string }
        issue_number: { type: integer }
        title: { type: string }
        slice_id: { type: string }
        phase: { type: string, enum: ["", L0, L1, L2, L3] }
        risk_tier: { type: string, enum: [standard, strict] }
        review_mode: { type: string, enum: [standard, strict] }
        has_ui: { type: boolean }
        run_ux: { type: boolean }
        preview_cmd: { type: string }
        base_branch: { type: string }
        base_sha: { type: string }
        branch_name: { type: string }
        verification_command: { type: string }
        allowed_folders: { type: array, items: { type: string } }
        forbidden_paths: { type: array, items: { type: string } }
        contract_path: { type: string }
        feedback_path: { type: string }
        before_summary: { type: string }
        feedback_summary: { type: string }
      required:
        - ready
        - cancel_reason
        - repo
        - pr_number
        - pr_url
        - issue_number
        - title
        - slice_id
        - phase
        - risk_tier
        - review_mode
        - has_ui
        - run_ux
        - preview_cmd
        - base_branch
        - base_sha
        - branch_name
        - verification_command
        - allowed_folders
        - forbidden_paths
        - contract_path
        - feedback_path
        - before_summary
        - feedback_summary

  - id: cancel-no-action
    depends_on: [fetch-pr-feedback]
    when: "$fetch-pr-feedback.output.ready == false"
    cancel: "Cannot revise PR: $fetch-pr-feedback.output.cancel_reason"

  - id: revise
    command: revise
    model: medium
    depends_on: [fetch-pr-feedback]
    when: "$fetch-pr-feedback.output.ready == true"
    with:
      contract_path: "$fetch-pr-feedback.output.contract_path"
      feedback_path: "$fetch-pr-feedback.output.feedback_path"
      pr_url: "$fetch-pr-feedback.output.pr_url"
      verification_command: "$fetch-pr-feedback.output.verification_command"
      has_ui: "$fetch-pr-feedback.output.has_ui"
      preview_cmd: "$fetch-pr-feedback.output.preview_cmd"
      allowed_folders: { from: "$fetch-pr-feedback.output.allowed_folders" }
      forbidden_paths: { from: "$fetch-pr-feedback.output.forbidden_paths" }
    output_format:
      type: object
      properties:
        done: { type: boolean }
        blocked: { type: boolean }
        summary: { type: string }
      required: [done, blocked, summary]

  - id: escalate-blocked
    depends_on: [revise]
    when: "$revise.output.blocked == true"
    wait:
      attention: |
        PR revision blocked on "$fetch-pr-feedback.output.title" ($fetch-pr-feedback.output.pr_url):
        $revise.output.summary
        Approve to acknowledge and end cleanly; Reject to cancel.
      form: approval
      labels:
        factory: "blocked"

  - id: cancel-blocked
    depends_on: [escalate-blocked]
    when: "$escalate-blocked.output.decision == 'reject'"
    cancel: "Cancelled after PR revision block: $escalate-blocked.output.text"

  - id: push-revise
    script: publish-pr
    runtime: bun
    depends_on: [fetch-pr-feedback, revise]
    when: "$revise.output.blocked == false"
    with:
      mode: "sync"
      repo: "$fetch-pr-feedback.output.repo"
      issue_number: "$fetch-pr-feedback.output.issue_number"
      title: "$fetch-pr-feedback.output.title"
      slice_id: "$fetch-pr-feedback.output.slice_id"
      phase: "$fetch-pr-feedback.output.phase"
      risk_tier: "$fetch-pr-feedback.output.risk_tier"
      has_ui: "$fetch-pr-feedback.output.has_ui"
      base_branch: "$fetch-pr-feedback.output.base_branch"
      base_sha: "$fetch-pr-feedback.output.base_sha"
      allowed_folders: { from: "$fetch-pr-feedback.output.allowed_folders" }
      forbidden_paths: { from: "$fetch-pr-feedback.output.forbidden_paths" }
      run_id: "$WORKFLOW_ID"
      branch_name: "$fetch-pr-feedback.output.branch_name"
      before_summary: "$fetch-pr-feedback.output.before_summary"
      before_capture_summary: ""
      rounds_ready: "false"
      rounds_reason: ""
      rounds_summary: ""
      impl_summary: "$revise.output.summary"
      round: "0"
      diff_stat: ""
      merge_mode: "$INPUTS.merge_mode"
    output_format:
      type: object
      properties:
        pr_number: { type: integer }
        pr_url: { type: string }
        head_sha: { type: string }
        diff_stat: { type: string }
        is_draft: { type: boolean }
        merge_action: { type: string, enum: [auto, ask, pr-only] }
        needs_human_merge_approval: { type: boolean }
        approval_message: { type: string }
        summary: { type: string }
      required:
        - pr_number
        - pr_url
        - head_sha
        - diff_stat
        - is_draft
        - merge_action
        - needs_human_merge_approval
        - approval_message
        - summary

  - id: rounds
    depends_on: [fetch-pr-feedback, revise, escalate-blocked, push-revise]
    trigger_rule: none_failed_min_one_success
    when: "$fetch-pr-feedback.output.ready == true && $revise.output.blocked == false"
    loop_group:
      max_iterations: 2
      on_exhausted: complete
      until_bash: |
        done=$qa.output.done
        test "$done" = "true"
      nodes:
        - id: fix
          command: fix
          model: medium
          context: { resume: revise }
          when: "$LOOP_PREV.qa.output.done == false"
          with:
            contract_path: "$fetch-pr-feedback.output.contract_path"
            verification_command: "$fetch-pr-feedback.output.verification_command"
            has_ui: "$fetch-pr-feedback.output.has_ui"
            preview_cmd: "$fetch-pr-feedback.output.preview_cmd"
            allowed_folders: { from: "$fetch-pr-feedback.output.allowed_folders" }
            forbidden_paths: { from: "$fetch-pr-feedback.output.forbidden_paths" }
            prev_summary: "$LOOP_PREV.qa.output.summary"
          output_format:
            type: object
            properties:
              done: { type: boolean }
              blocked: { type: boolean }
              summary: { type: string }
            required: [done, blocked, summary]

        - id: push-fix
          script: publish-pr
          runtime: bun
          depends_on: [fix]
          when: "$LOOP_PREV.qa.output.done == false && $fix.output.blocked == false"
          with:
            mode: "sync"
            repo: "$fetch-pr-feedback.output.repo"
            issue_number: "$fetch-pr-feedback.output.issue_number"
            title: "$fetch-pr-feedback.output.title"
            slice_id: "$fetch-pr-feedback.output.slice_id"
            phase: "$fetch-pr-feedback.output.phase"
            risk_tier: "$fetch-pr-feedback.output.risk_tier"
            has_ui: "$fetch-pr-feedback.output.has_ui"
            base_branch: "$fetch-pr-feedback.output.base_branch"
            base_sha: "$fetch-pr-feedback.output.base_sha"
            allowed_folders: { from: "$fetch-pr-feedback.output.allowed_folders" }
            forbidden_paths: { from: "$fetch-pr-feedback.output.forbidden_paths" }
            run_id: "$WORKFLOW_ID"
            branch_name: "$fetch-pr-feedback.output.branch_name"
            before_summary: "$fetch-pr-feedback.output.before_summary"
            before_capture_summary: ""
            rounds_ready: "false"
            rounds_reason: ""
            rounds_summary: ""
            impl_summary: "$fix.output.summary"
            round: "$LOOP_PREV.qa.output.round"
            diff_stat: ""
            merge_mode: "$INPUTS.merge_mode"
          output_format:
            type: object
            properties:
              pr_number: { type: integer }
              pr_url: { type: string }
              head_sha: { type: string }
              diff_stat: { type: string }
              is_draft: { type: boolean }
              merge_action: { type: string, enum: [auto, ask, pr-only] }
              needs_human_merge_approval: { type: boolean }
              approval_message: { type: string }
              summary: { type: string }
            required:
              - pr_number
              - pr_url
              - head_sha
              - diff_stat
              - is_draft
              - merge_action
              - needs_human_merge_approval
              - approval_message
              - summary

        # Gate, UX verification, the three review axes, and the round verdict live in the
        # shared block both delivery workflows include. It always runs so the verdict can
        # report a blocked fixer; the gate stops itself when `fix` reports a blocker.
        - id: qa
          include: factory-qa
          depends_on: [fix, push-fix]
          trigger_rule: all_done
          with:
            base_sha: "$fetch-pr-feedback.output.base_sha"
            verification_command: "$fetch-pr-feedback.output.verification_command"
            allowed_folders: { from: "$fetch-pr-feedback.output.allowed_folders" }
            forbidden_paths: { from: "$fetch-pr-feedback.output.forbidden_paths" }
            contract_has_ui: "$fetch-pr-feedback.output.has_ui"
            preview_cmd: "$fetch-pr-feedback.output.preview_cmd"
            contract_path: "$fetch-pr-feedback.output.contract_path"
            review_mode: "$fetch-pr-feedback.output.review_mode"
            repo: "$fetch-pr-feedback.output.repo"
            issue_number: "$fetch-pr-feedback.output.issue_number"
            pr_number: "$fetch-pr-feedback.output.pr_number"
            previous_round: "$LOOP_PREV.qa.output.round"
            fix_blocked: { from: "$fix.output.blocked", if_skipped: false }
            fix_summary: { from: "$fix.output.summary", if_skipped: "" }

  # Put the escalation in the PR thread, so GitHub answers this pause without the web UI.
  - id: escalation-prompt
    script: escalation-prompt
    runtime: bun
    depends_on: [rounds]
    when: "$rounds.output.ready == false"
    with:
      repo: "$fetch-pr-feedback.output.repo"
      pr_number: "$fetch-pr-feedback.output.pr_number"
      reason: "$rounds.output.reason"
      summary: "$rounds.output.summary"
    output_format:
      type: object
      properties:
        posted: { type: boolean }
        summary: { type: string }
      required: [posted, summary]

  - id: escalate-rounds
    depends_on: [rounds, escalation-prompt]
    when: "$rounds.output.ready == false"
    wait:
      attention: |
        PR revision "$fetch-pr-feedback.output.title" ($fetch-pr-feedback.output.pr_url) did not reach green LGTM ($rounds.output.reason).
        Summary: $rounds.output.summary

        Reason `implement_blocked` is a scope blocker: the work needs a path outside the reserved folders, and the fixer cannot widen the reservation itself.
        Read round-feedback.md and mechanical-gate.md in this run's artifacts before deciding.
      form: select
      options:
        - id: leave-open
          label: "Keep the PR for manual review"
          does: "Ends the run after finalizing the PR body and evidence; nothing merges. Use when the remaining work is small enough to finish by hand."
        - id: widen-reservation
          label: "Widen the reservation, then re-run"
          does: "Ends the run untouched. You add the needed folder to `**Allowed Folders:**` (or the `allowed_folders` input) and start a new run; the reservation is re-checked against other live runs."
        - id: split-slice
          label: "Split the out-of-scope work into another slice"
          does: "Ends the run untouched. You file the extra work as its own slice, then re-run this revision with its reservation unchanged."
        - id: cancel
          label: "Cancel this run"
          does: "Cancels the run. The PR and branch stay on disk for you to delete or keep."
      labels:
        factory: "escalated"

  - id: cancel-exhausted
    depends_on: [escalate-rounds]
    when: "$escalate-rounds.output.decision == 'cancel'"
    cancel: "Cancelled after PR revision QA escalation: $escalate-rounds.output.text"

  # Typed decision gate: a skipped loop_group has no output, so finalize-pr must not
  # dot-access it. Resolve readiness here and gate finalize-pr on this node.
  - id: rounds-gate
    script: rounds-gate
    runtime: bun
    depends_on: [rounds, escalate-rounds]
    trigger_rule: all_done
    with:
      rounds_ready: { from: "$rounds.output.ready", if_skipped: false }
      escalation_decision: { from: "$escalate-rounds.output.decision", if_skipped: "" }
    output_format:
      type: object
      properties:
        finalize: { type: boolean }
      required: [finalize]

  - id: finalize-pr
    script: publish-pr
    runtime: bun
    depends_on: [fetch-pr-feedback, push-revise, rounds, escalate-rounds, rounds-gate]
    trigger_rule: none_failed_min_one_success
    when: "$rounds-gate.output.finalize == true"
    with:
      mode: "finalize"
      repo: "$fetch-pr-feedback.output.repo"
      issue_number: "$fetch-pr-feedback.output.issue_number"
      title: "$fetch-pr-feedback.output.title"
      slice_id: "$fetch-pr-feedback.output.slice_id"
      phase: "$fetch-pr-feedback.output.phase"
      risk_tier: "$fetch-pr-feedback.output.risk_tier"
      has_ui: "$rounds.output.effective_has_ui"
      base_branch: "$fetch-pr-feedback.output.base_branch"
      base_sha: "$fetch-pr-feedback.output.base_sha"
      allowed_folders: { from: "$fetch-pr-feedback.output.allowed_folders" }
      forbidden_paths: { from: "$fetch-pr-feedback.output.forbidden_paths" }
      run_id: "$WORKFLOW_ID"
      branch_name: "$fetch-pr-feedback.output.branch_name"
      before_summary: "$fetch-pr-feedback.output.before_summary"
      before_capture_summary: ""
      rounds_ready: "$rounds.output.ready"
      rounds_reason: "$rounds.output.reason"
      rounds_summary: "$rounds.output.summary"
      impl_summary: ""
      round: "$rounds.output.round"
      diff_stat: "$rounds.output.diff_stat"
      merge_mode: "$INPUTS.merge_mode"
    output_format:
      type: object
      properties:
        pr_number: { type: integer }
        pr_url: { type: string }
        head_sha: { type: string }
        diff_stat: { type: string }
        is_draft: { type: boolean }
        merge_action: { type: string, enum: [auto, ask, pr-only] }
        needs_human_merge_approval: { type: boolean }
        approval_message: { type: string }
        summary: { type: string }
      required:
        - pr_number
        - pr_url
        - head_sha
        - diff_stat
        - is_draft
        - merge_action
        - needs_human_merge_approval
        - approval_message
        - summary

  - id: merge-approval
    depends_on: [finalize-pr]
    when: "$finalize-pr.output.needs_human_merge_approval == true"
    wait:
      attention: "$finalize-pr.output.approval_message"
      form: approval
      labels:
        factory: "merge-checkpoint"

  - id: ci-merge
    script: ci-merge
    runtime: bun
    depends_on: [finalize-pr, merge-approval]
    trigger_rule: none_failed_min_one_success
    when: "$finalize-pr.output.merge_action == 'auto' || $finalize-pr.output.needs_human_merge_approval == true && $merge-approval.output.decision == 'approve'"
    with:
      repo: "$fetch-pr-feedback.output.repo"
      pr_number: "$finalize-pr.output.pr_number"
      head_sha: "$finalize-pr.output.head_sha"
      ci_wait_seconds: "$INPUTS.ci_wait_seconds"
    output_format:
      type: object
      properties:
        merged: { type: boolean }
        ci_status: { type: string, enum: [green, failed, pending, skipped] }
        summary: { type: string }
      required: [merged, ci_status, summary]

  - id: ci-escalation
    depends_on: [ci-merge]
    when: "$ci-merge.output.merged == false && $ci-merge.output.ci_status == 'failed'"
    wait:
      attention: |
        CI failed on PR $finalize-pr.output.pr_url ($ci-merge.output.summary).
        Approve to acknowledge and finish the run with PR left open; Reject to cancel.
      form: approval
      labels:
        factory: "ci-failed"

  - id: summary
    script: summary
    runtime: bun
    depends_on: [escalate-blocked, finalize-pr, merge-approval, ci-merge, ci-escalation]
    trigger_rule: none_failed_min_one_success
    with:
      pr_url: { from: "$finalize-pr.output.pr_url", if_skipped: null }
      impl_blocked: "$revise.output.blocked"
      impl_summary: "$revise.output.summary"
      rounds_ready: { from: "$rounds.output.ready", if_skipped: null }
      merge_decision: { from: "$merge-approval.output.decision", if_skipped: null }
      merged: { from: "$ci-merge.output.merged", if_skipped: null }
      ci_status: { from: "$ci-merge.output.ci_status", if_skipped: null }
      pr_summary: { from: "$finalize-pr.output.summary", if_skipped: null }
      merge_summary: { from: "$ci-merge.output.summary", if_skipped: null }
    output_format:
      type: object
      properties:
        delivered: { type: boolean }
        merged: { type: boolean }
        pr_url: { type: string }
        status: { type: string }
        summary: { type: string }
      required: [delivered, merged, pr_url, status, summary]
