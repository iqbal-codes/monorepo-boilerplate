# Green path: standard non-UI L2 slice -> Draft PR (factory:review) -> 2 independent QA axes (LGTM, factory:approved) -> Ready PR -> auto-merge.
fixture:
  expect: completed
  inputs:
    issue: "7"
    merge_mode: checkpoint

fetch-contract:
