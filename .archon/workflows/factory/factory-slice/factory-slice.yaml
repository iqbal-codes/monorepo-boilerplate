name: factory-slice
description: |
  Delivers a scoped change from a GitHub issue or Markdown contract. Runs TDD
  implementation (factory:in-progress), opens a draft PR (factory:review), executes
  deterministic folder-reservation, protected-path, and verification gates, optional black-box
  browser UX verification, and sequential fresh-context independent QA review
  (consolidated Code+Spec+Standards, plus Seams & Failure-Safety on risk:strict) that reads
  the current-round UX report. When QA finds defects, it posts round findings to the PR,
  moves to factory:changes-requested, and runs a fresh-context targeted `fix` pass.
  Once all gates & QA pass LGTM (factory:approved), finalizes the PR with
  Before/After evidence (`pr-evidence` branch) and runs policy-gated CI merge.

inputs:
  issue:
    default: ""
    description: GitHub issue number to implement (e.g. "3"). Leave empty when using spec_file.
  spec_file:
    default: ""
    description: Optional path to a Markdown slice contract, relative to the checkout or absolute.
  repo:
    default: ""
    description: Optional GitHub owner/repo (auto-detected from git remote origin when empty).
  base_branch:
    default: ""
    description: Optional target base branch (auto-detected from origin/HEAD or main when empty).
  merge_mode:
    default: "ask"
    description: >-
      Merge policy: ask (default — always pause before merge),
      checkpoint (pause on L0 UI, L1, L3, and unphased UI PRs; otherwise auto-merge green PRs),
      auto (auto-merge all green PRs), ui-ask (pause on all UI PRs, auto-merge non-UI),
      or pr-only (open PR without merging).
  preview_cmd:
    default: ""
    description: >-
      Optional command to start an isolated web preview server for browser verification.
      Defaults to .archon/ui-preview.sh when present and executable.
  ci_wait_seconds:
    default: "600"
    description: Max seconds to poll GitHub Actions checks before timing out ("0" skips waiting).
  allowed_folders:
    default: "[]"
    description: JSON array of reserved repository-relative directories ending in /. Empty leaves edits unreserved.
  exclusive:
    default: "false"
    description: Set to true to run without other factory delivery or revision runs. Leave allowed_folders empty.

worktree:
  enabled: true

returns:
  node: summary
  outcome: delivered

nodes:
  - id: fetch-contract
    script: fetch-contract
    runtime: bun
    with:
      issue: "$INPUTS.issue"
      spec_file: "$INPUTS.spec_file"
      repo: "$INPUTS.repo"
      base_branch: "$INPUTS.base_branch"
      preview_cmd: "$INPUTS.preview_cmd"
      allowed_folders: "$INPUTS.allowed_folders"
      exclusive: "$INPUTS.exclusive"
      run_id: "$WORKFLOW_ID"
    output_format:
      type: object
      properties:
        source: { type: string, enum: [issue, file, arguments] }
        repo: { type: string }
        issue_number: { type: integer }
        title: { type: string }
        slice_id: { type: string }
        phase: { type: string, enum: ["", L0, L1, L2, L3] }
        risk_tier: { type: string, enum: [standard, strict] }
        review_mode: { type: string, enum: [standard, strict] }
        contract_ok: { type: boolean }
        contract_error: { type: string }
        has_ui: { type: boolean }
        run_ux: { type: boolean }
        capture_before: { type: boolean }
        preview_cmd: { type: string }
        base_branch: { type: string }
        base_sha: { type: string }
        branch_name: { type: string }
        verification_command: { type: string }
        allowed_folders: { type: array, items: { type: string } }
        forbidden_paths: { type: array, items: { type: string } }
        blockers_ok: { type: boolean }
        unmet_blockers: { type: array, items: { type: string } }
        contract_path: { type: string }
        before_summary: { type: string }
      required:
        - source
        - repo
        - issue_number
        - title
        - slice_id
        - phase
        - risk_tier
        - review_mode
        - contract_ok
        - contract_error
        - has_ui
        - run_ux
        - capture_before
        - preview_cmd
        - base_branch
        - base_sha
        - branch_name
        - verification_command
        - allowed_folders
        - forbidden_paths
        - blockers_ok
        - unmet_blockers
        - contract_path
        - before_summary

  - id: invalid-contract-cancel
    depends_on: [fetch-contract]
    when: "$fetch-contract.output.contract_ok == false"
    cancel: "Cannot start slice: incomplete slice contract ($fetch-contract.output.contract_error)."

  - id: blocked-cancel
    depends_on: [fetch-contract]
    when: "$fetch-contract.output.contract_ok == true && $fetch-contract.output.blockers_ok == false"
    cancel: "Cannot start slice: unmet Blocked By dependencies ($fetch-contract.output.unmet_blockers)."

  # Only runs on brownfield UI changes where target UI files already exist on base_branch
  # AND a preview runner (.archon/ui-preview.sh or preview_cmd) is available.
  - id: capture-before
    command: capture-before
    model: medium
    context: fresh
    mutates_checkout: false
    skills:
      - { name: agent-browser, optional: true }
    depends_on: [fetch-contract]
    when: "$fetch-contract.output.contract_ok == true && $fetch-contract.output.blockers_ok == true && $fetch-contract.output.capture_before == true"
    with:
      contract_path: "$fetch-contract.output.contract_path"
      preview_cmd: "$fetch-contract.output.preview_cmd"
      base_sha: "$fetch-contract.output.base_sha"
    output_format:
      type: object
      properties:
        captured: { type: boolean }
        screenshots: { type: array, items: { type: string } }
        summary: { type: string }
      required: [captured, screenshots, summary]

  # Stage 1: Initial TDD implementation (`factory:in-progress`) whose session is resumed if QA sends changes back.
  - id: implement
    command: implement
    model: medium
    skills:
      - { name: agent-browser, optional: true }
      - { name: shadcn, optional: true }
      - { name: modern-web-guidance, optional: true }
      - { name: better-interface, optional: true }
      - { name: assistant-ui, optional: true }
    depends_on: [fetch-contract, capture-before]
    trigger_rule: none_failed_min_one_success
    when: "$fetch-contract.output.contract_ok == true && $fetch-contract.output.blockers_ok == true"
    with:
      contract_path: "$fetch-contract.output.contract_path"
      base_branch: "$fetch-contract.output.base_branch"
      verification_command: "$fetch-contract.output.verification_command"
      has_ui: "$fetch-contract.output.has_ui"
      preview_cmd: "$fetch-contract.output.preview_cmd"
      allowed_folders: { from: "$fetch-contract.output.allowed_folders" }
      forbidden_paths: { from: "$fetch-contract.output.forbidden_paths" }
    output_format:
      type: object
      properties:
        done: { type: boolean }
        blocked: { type: boolean }
        summary: { type: string }
      required: [done, blocked, summary]

  - id: escalate-blocked
    depends_on: [implement]
    when: "$implement.output.blocked == true"
    wait:
      attention: |
        Implementation blocked on "$fetch-contract.output.title" before opening a PR:
        $implement.output.summary
        Approve to acknowledge and end cleanly; Reject to cancel.
      form: approval
      labels:
        factory: "blocked"

  - id: cancel-blocked
    depends_on: [escalate-blocked]
    when: "$escalate-blocked.output.decision == 'reject'"
    cancel: "Cancelled after implementer block: $escalate-blocked.output.text"

  # Stage 2: Open Draft PR and move Issue + PR to `factory:review` before QA begins.
  - id: publish-draft-pr
    script: publish-pr
    runtime: bun
    depends_on: [fetch-contract, capture-before, implement]
    trigger_rule: none_failed_min_one_success
    when: "$implement.output.blocked == false"
    with:
      mode: "draft"
      repo: "$fetch-contract.output.repo"
      issue_number: "$fetch-contract.output.issue_number"
      title: "$fetch-contract.output.title"
      slice_id: "$fetch-contract.output.slice_id"
      phase: "$fetch-contract.output.phase"
      risk_tier: "$fetch-contract.output.risk_tier"
      has_ui: "$fetch-contract.output.has_ui"
      base_branch: "$fetch-contract.output.base_branch"
      base_sha: "$fetch-contract.output.base_sha"
      allowed_folders: { from: "$fetch-contract.output.allowed_folders" }
      exclusive: "$INPUTS.exclusive"
      forbidden_paths: { from: "$fetch-contract.output.forbidden_paths" }
      run_id: "$WORKFLOW_ID"
      branch_name: "$fetch-contract.output.branch_name"
      before_summary: "$fetch-contract.output.before_summary"
      before_capture_summary: { from: "$capture-before.output.summary", if_skipped: null }
      rounds_ready: "false"
      rounds_reason: ""
      rounds_summary: ""
      impl_summary: "$implement.output.summary"
      round: "1"
      diff_stat: ""
      merge_mode: "$INPUTS.merge_mode"
    output_format:
      type: object
      properties:
        pr_number: { type: integer }
        pr_url: { type: string }
        head_sha: { type: string }
        diff_stat: { type: string }
        is_draft: { type: boolean }
        merge_action: { type: string, enum: [auto, ask, pr-only] }
        needs_human_merge_approval: { type: boolean }
        approval_message: { type: string }
        summary: { type: string }
      required:
        - pr_number
        - pr_url
        - head_sha
        - diff_stat
        - is_draft
        - merge_action
        - needs_human_merge_approval
        - approval_message
        - summary

  # Stage 3: QA Review <-> Targeted Fix Loop.
  # Round 1 goes straight into Gate -> optional UX -> consolidated fresh-context QA review.
  # If findings exist, verdict posts a PR review comment, flips to `factory:changes-requested`,
  # and Round 2+ runs a fresh-context `fix` pass reading round-feedback.md + review/code.md,
  # pushes the fix commit, and returns to `factory:review`.
  - id: rounds
    depends_on: [fetch-contract, capture-before, implement, escalate-blocked, publish-draft-pr]
    trigger_rule: none_failed_min_one_success
    when: "$fetch-contract.output.contract_ok == true && $fetch-contract.output.blockers_ok == true && $implement.output.blocked == false"
    loop_group:
      max_iterations: 3
      on_exhausted: complete
      until_bash: |
        done=$qa.output.done
        test "$done" = "true"
      nodes:
        - id: fix
          command: fix
          model: medium
          context: fresh
          skills:
            - { name: agent-browser, optional: true }
            - { name: shadcn, optional: true }
            - { name: modern-web-guidance, optional: true }
            - { name: better-interface, optional: true }
            - { name: assistant-ui, optional: true }
          when: "$LOOP_PREV.qa.output.done == false"
          with:
            contract_path: "$fetch-contract.output.contract_path"
            verification_command: "$fetch-contract.output.verification_command"
            has_ui: "$fetch-contract.output.has_ui"
            preview_cmd: "$fetch-contract.output.preview_cmd"
            allowed_folders: { from: "$fetch-contract.output.allowed_folders" }
            forbidden_paths: { from: "$fetch-contract.output.forbidden_paths" }
            prev_summary: "$LOOP_PREV.qa.output.summary"
          output_format:
            type: object
            properties:
              done: { type: boolean }
              blocked: { type: boolean }
              summary: { type: string }
            required: [done, blocked, summary]

        - id: push-fix
          script: publish-pr
          runtime: bun
          depends_on: [fix]
          when: "$LOOP_PREV.qa.output.done == false && $fix.output.blocked == false"
          with:
            mode: "sync"
            repo: "$fetch-contract.output.repo"
            issue_number: "$fetch-contract.output.issue_number"
            title: "$fetch-contract.output.title"
            slice_id: "$fetch-contract.output.slice_id"
            phase: "$fetch-contract.output.phase"
            risk_tier: "$fetch-contract.output.risk_tier"
            has_ui: "$fetch-contract.output.has_ui"
            base_branch: "$fetch-contract.output.base_branch"
            base_sha: "$fetch-contract.output.base_sha"
            allowed_folders: { from: "$fetch-contract.output.allowed_folders" }
            exclusive: "$INPUTS.exclusive"
            forbidden_paths: { from: "$fetch-contract.output.forbidden_paths" }
            run_id: "$WORKFLOW_ID"
            branch_name: "$fetch-contract.output.branch_name"
            before_summary: "$fetch-contract.output.before_summary"
            before_capture_summary: { from: "$capture-before.output.summary", if_skipped: null }
            rounds_ready: "false"
            rounds_reason: ""
            rounds_summary: ""
            impl_summary: "$fix.output.summary"
            round: "$LOOP_PREV.qa.output.round"
            diff_stat: ""
            merge_mode: "$INPUTS.merge_mode"
          output_format:
            type: object
            properties:
              pr_number: { type: integer }
              pr_url: { type: string }
              head_sha: { type: string }
              diff_stat: { type: string }
              is_draft: { type: boolean }
              merge_action: { type: string, enum: [auto, ask, pr-only] }
              needs_human_merge_approval: { type: boolean }
              approval_message: { type: string }
              summary: { type: string }
            required:
              - pr_number
              - pr_url
              - head_sha
              - diff_stat
              - is_draft
              - merge_action
              - needs_human_merge_approval
              - approval_message
              - summary

        # Gate, UX verification, the three review axes, and the round verdict live in the
        # shared block both delivery workflows include. It always runs so the verdict can
        # report a blocked fixer; the gate stops itself when `fix` reports a blocker.
        - id: qa
          include: factory-qa
          depends_on: [fix, push-fix]
          trigger_rule: all_done
          with:
            base_sha: "$fetch-contract.output.base_sha"
            verification_command: "$fetch-contract.output.verification_command"
            allowed_folders: { from: "$fetch-contract.output.allowed_folders" }
            forbidden_paths: { from: "$fetch-contract.output.forbidden_paths" }
            contract_has_ui: "$fetch-contract.output.has_ui"
            preview_cmd: "$fetch-contract.output.preview_cmd"
            contract_path: "$fetch-contract.output.contract_path"
            review_mode: "$fetch-contract.output.review_mode"
            repo: "$fetch-contract.output.repo"
            issue_number: "$fetch-contract.output.issue_number"
            pr_number: "$publish-draft-pr.output.pr_number"
            previous_round: "$LOOP_PREV.qa.output.round"
            fix_blocked: { from: "$fix.output.blocked", if_skipped: false }
            fix_summary: { from: "$fix.output.summary", if_skipped: "" }

  # Put the escalation in the PR thread, so GitHub answers this pause without the web UI.
  - id: escalation-prompt
    script: escalation-prompt
    runtime: bun
    depends_on: [rounds]
    when: "$rounds.output.ready == false"
    with:
      repo: "$fetch-contract.output.repo"
      pr_number: "$publish-draft-pr.output.pr_number"
      reason: "$rounds.output.reason"
      summary: "$rounds.output.summary"
    output_format:
      type: object
      properties:
        posted: { type: boolean }
        summary: { type: string }
      required: [posted, summary]

  # Pause for human direction if the 3-round QA budget ran out or fix pass hit a blocker.
  - id: escalate-rounds
    depends_on: [rounds, escalation-prompt]
    when: "$rounds.output.ready == false"
    wait:
      attention: |
        Slice "$fetch-contract.output.title" (Draft PR $publish-draft-pr.output.pr_url) did not reach green LGTM ($rounds.output.reason).
        Summary: $rounds.output.summary

        Reason `implement_blocked` is a scope blocker: the work needs a path outside the reserved folders, and the fixer cannot widen the reservation itself.
        Read round-feedback.md and mechanical-gate.md in this run's artifacts before deciding.
      form: select
      options:
        - id: leave-open
          label: "Keep the Draft PR for manual follow-up"
          does: "Ends the run after finalizing the PR body and evidence; nothing merges. Use when the remaining work is small enough to finish by hand."
        - id: widen-reservation
          label: "Widen the reservation, then re-run"
          does: "Ends the run untouched. You add the needed folder to `**Allowed Folders:**` (or the `allowed_folders` input) and start a new run; the reservation is re-checked against other live runs."
        - id: split-slice
          label: "Split the out-of-scope work into another slice"
          does: "Ends the run untouched. You file the extra work as its own slice, then re-run this one with its reservation unchanged."
        - id: cancel
          label: "Cancel this run"
          does: "Cancels the run. The branch and Draft PR stay on disk for you to delete or keep."
      labels:
        factory: "escalated"

  - id: cancel-exhausted
    depends_on: [escalate-rounds]
    when: "$escalate-rounds.output.decision == 'cancel'"
    cancel: "Cancelled after QA round escalation: $escalate-rounds.output.text"

  # Typed decision gate: a skipped loop_group has no output, so finalize-pr must not
  # dot-access it. Resolve readiness here and gate finalize-pr on this node.
  - id: rounds-gate
    script: rounds-gate
    runtime: bun
    depends_on: [rounds, escalate-rounds]
    trigger_rule: all_done
    with:
      rounds_ready: { from: "$rounds.output.ready", if_skipped: false }
      escalation_decision: { from: "$escalate-rounds.output.decision", if_skipped: "" }
    output_format:
      type: object
      properties:
        finalize: { type: boolean }
      required: [finalize]

  # Stage 4: Finalize PR body, embed pr-evidence PNGs, mark Ready for Review, and evaluate merge policy.
  - id: finalize-pr
    script: publish-pr
    runtime: bun
    depends_on: [fetch-contract, capture-before, publish-draft-pr, rounds, escalate-rounds, rounds-gate]
    trigger_rule: none_failed_min_one_success
    when: "$rounds-gate.output.finalize == true"
    with:
      mode: "finalize"
      repo: "$fetch-contract.output.repo"
      issue_number: "$fetch-contract.output.issue_number"
      title: "$fetch-contract.output.title"
      slice_id: "$fetch-contract.output.slice_id"
      phase: "$fetch-contract.output.phase"
      risk_tier: "$fetch-contract.output.risk_tier"
      has_ui: "$rounds.output.effective_has_ui"
      base_branch: "$fetch-contract.output.base_branch"
      base_sha: "$fetch-contract.output.base_sha"
      allowed_folders: { from: "$fetch-contract.output.allowed_folders" }
      exclusive: "$INPUTS.exclusive"
      forbidden_paths: { from: "$fetch-contract.output.forbidden_paths" }
      run_id: "$WORKFLOW_ID"
      branch_name: "$fetch-contract.output.branch_name"
      before_summary: "$fetch-contract.output.before_summary"
      before_capture_summary: { from: "$capture-before.output.summary", if_skipped: null }
      rounds_ready: "$rounds.output.ready"
      rounds_reason: "$rounds.output.reason"
      rounds_summary: "$rounds.output.summary"
      impl_summary: ""
      round: "$rounds.output.round"
      diff_stat: "$rounds.output.diff_stat"
      merge_mode: "$INPUTS.merge_mode"
    output_format:
      type: object
      properties:
        pr_number: { type: integer }
        pr_url: { type: string }
        head_sha: { type: string }
        diff_stat: { type: string }
        is_draft: { type: boolean }
        merge_action: { type: string, enum: [auto, ask, pr-only] }
        needs_human_merge_approval: { type: boolean }
        approval_message: { type: string }
        summary: { type: string }
      required:
        - pr_number
        - pr_url
        - head_sha
        - diff_stat
        - is_draft
        - merge_action
        - needs_human_merge_approval
        - approval_message
        - summary

  - id: merge-approval
    depends_on: [finalize-pr]
    when: "$finalize-pr.output.needs_human_merge_approval == true"
    wait:
      attention: "$finalize-pr.output.approval_message"
      form: approval
      labels:
        factory: "merge-checkpoint"

  - id: ci-merge
    script: ci-merge
    runtime: bun
    depends_on: [finalize-pr, merge-approval]
    trigger_rule: none_failed_min_one_success
    when: "$finalize-pr.output.merge_action == 'auto' || $finalize-pr.output.needs_human_merge_approval == true && $merge-approval.output.decision == 'approve'"
    with:
      repo: "$fetch-contract.output.repo"
      pr_number: "$finalize-pr.output.pr_number"
      head_sha: "$finalize-pr.output.head_sha"
      ci_wait_seconds: "$INPUTS.ci_wait_seconds"
    output_format:
      type: object
      properties:
        merged: { type: boolean }
        ci_status: { type: string, enum: [green, failed, pending, skipped] }
        summary: { type: string }
      required: [merged, ci_status, summary]

  - id: ci-escalation
    depends_on: [ci-merge]
    when: "$ci-merge.output.merged == false && $ci-merge.output.ci_status == 'failed'"
    wait:
      attention: |
        CI failed on PR $finalize-pr.output.pr_url ($ci-merge.output.summary).
        Approve to acknowledge and finish the run with PR left open; Reject to cancel.
      form: approval
      labels:
        factory: "ci-failed"

  - id: summary
    script: summary
    runtime: bun
    depends_on: [escalate-blocked, finalize-pr, merge-approval, ci-merge, ci-escalation]
    trigger_rule: none_failed_min_one_success
    with:
      pr_url: { from: "$finalize-pr.output.pr_url", if_skipped: null }
      impl_blocked: "$implement.output.blocked"
      impl_summary: "$implement.output.summary"
      rounds_ready: { from: "$rounds.output.ready", if_skipped: null }
      merge_decision: { from: "$merge-approval.output.decision", if_skipped: null }
      merged: { from: "$ci-merge.output.merged", if_skipped: null }
      ci_status: { from: "$ci-merge.output.ci_status", if_skipped: null }
      pr_summary: { from: "$finalize-pr.output.summary", if_skipped: null }
      merge_summary: { from: "$ci-merge.output.summary", if_skipped: null }
    output_format:
      type: object
      properties:
        delivered: { type: boolean }
        merged: { type: boolean }
        pr_url: { type: string }
        status: { type: string }
        summary: { type: string }
      required: [delivered, merged, pr_url, status, summary]
