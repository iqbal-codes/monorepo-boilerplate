server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A Customers URL can contain 50 tags of 64 UTF-16 units: up to 28,800
    # percent-encoded bytes, plus JSON delimiters, a 200-unit search and other params.
    # Nginx must fit the entire request line into one buffer (default: 8k).
    large_client_header_buffers 4 32k;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
